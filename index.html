<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metaball Gradient Background (WebGL)</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Background layer (non-interactive) -->
    <div id="bg" aria-hidden="true">
      <canvas id="glCanvas"></canvas>
    </div>

    <!-- Floating control panel (for testing/tuning) -->
    <aside class="panel" id="panel" aria-label="Background controls">
      <div class="panel__header">
        <div class="panel__title">Background</div>
        <button class="panel__toggle" id="panelToggle" type="button" aria-expanded="true">
          Hide
        </button>
      </div>

      <div class="panel__body" id="panelBody">
        <div class="control">
          <label class="control__label" for="blobCount">Metaballs</label>
          <div class="control__row">
            <input id="blobCount" type="range" min="1" max="8" step="1" />
            <output class="control__value" id="blobCountValue"></output>
          </div>
        </div>

        <div class="control">
          <label class="control__label" for="grain">Grain</label>
          <div class="control__row">
            <input id="grain" type="range" min="0" max="1" step="0.01" />
            <output class="control__value" id="grainValue"></output>
          </div>
        </div>

        <div class="control">
          <label class="control__label" for="distAmount">Blob Distortion</label>
          <div class="control__row">
            <input id="distAmount" type="range" min="0" max="1" step="0.01" />
            <output class="control__value" id="distAmountValue"></output>
          </div>
        </div>

        <div class="control">
          <label class="control__label" for="distScale">Distortion Scale</label>
          <div class="control__row">
            <input id="distScale" type="range" min="0.25" max="4" step="0.01" />
            <output class="control__value" id="distScaleValue"></output>
          </div>
        </div>

        <div class="control">
          <label class="control__label" for="distSpeed">Distortion Speed</label>
          <div class="control__row">
            <input id="distSpeed" type="range" min="0" max="1" step="0.01" />
            <output class="control__value" id="distSpeedValue"></output>
          </div>
        </div>

        <div class="control">
          <label class="control__label" for="globalSoftness">Global Softness</label>
          <div class="control__row">
            <input id="globalSoftness" type="range" min="0.4" max="1.8" step="0.01" />
            <output class="control__value" id="globalSoftnessValue"></output>
          </div>
        </div>

        <div class="control">
          <label class="control__label" for="softVar">Softness Variation</label>
          <div class="control__row">
            <input id="softVar" type="range" min="0" max="0.6" step="0.01" />
            <output class="control__value" id="softVarValue"></output>
          </div>
        </div>

        <div class="panel__divider"></div>

        <div class="control">
          <label class="control__label" for="edgeBlurMin">Edge Blur Min</label>
          <div class="control__row">
            <input id="edgeBlurMin" type="range" min="0" max="1" step="0.01" />
            <output class="control__value" id="edgeBlurMinValue"></output>
          </div>
        </div>

        <div class="control">
          <label class="control__label" for="edgeBlurMax">Edge Blur Max</label>
          <div class="control__row">
            <input id="edgeBlurMax" type="range" min="0" max="1" step="0.01" />
            <output class="control__value" id="edgeBlurMaxValue"></output>
          </div>
        </div>

        <div class="control">
          <label class="control__label" for="edgeBlurSpeed">Edge Blur Randomize Speed</label>
          <div class="control__row">
            <input id="edgeBlurSpeed" type="range" min="0" max="1" step="0.01" />
            <output class="control__value" id="edgeBlurSpeedValue"></output>
          </div>
          <div class="control__actions">
            <button class="btn btn--ghost" id="edgeBlurRandomize" type="button">Randomize now</button>
          </div>
        </div>

        <div class="panel__divider"></div>

        <div class="control">
          <label class="control__label" for="overlayMode">Overlay Mode</label>
          <div class="control__row">
            <select id="overlayMode">
              <option value="0">None</option>
              <option value="1">Fake Glass</option>
              <option value="2">Wave Warp</option>
            </select>
            <output class="control__value" id="overlayModeValue"></output>
          </div>
        </div>

        <div id="fakeGlassControls">
          <div class="control">
            <label class="control__label" for="glassShapeType">Glass Shape Type</label>
            <div class="control__row">
              <select id="glassShapeType">
                <option value="1">Vertical Bands</option>
                <option value="2">Ovals</option>
                <option value="3">Concentric Circles</option>
              </select>
              <output class="control__value" id="glassShapeTypeValue"></output>
            </div>
          </div>

          <div class="control">
            <label class="control__label" for="glassRotate">Glass Rotation</label>
            <div class="control__row">
              <input id="glassRotate" type="range" min="-180" max="180" step="1" />
              <output class="control__value" id="glassRotateValue"></output>
            </div>
          </div>

          <div class="control">
            <label class="control__label" for="glassTwirl">Glass Twirl</label>
            <div class="control__row">
              <input id="glassTwirl" type="range" min="0" max="1" step="0.01" />
              <output class="control__value" id="glassTwirlValue"></output>
            </div>
          </div>

          <div class="control">
            <label class="control__label" for="glassAmount">Glass Amount</label>
            <div class="control__row">
              <input id="glassAmount" type="range" min="0" max="1" step="0.01" />
              <output class="control__value" id="glassAmountValue"></output>
            </div>
          </div>

          <div class="control">
            <label class="control__label" for="glassDistortion">Glass Distortion</label>
            <div class="control__row">
              <input id="glassDistortion" type="range" min="0" max="1" step="0.01" />
              <output class="control__value" id="glassDistortionValue"></output>
            </div>
          </div>

          <div class="control">
            <label class="control__label" for="glassHighlight">Glass Highlight</label>
            <div class="control__row">
              <input id="glassHighlight" type="range" min="0" max="1" step="0.01" />
              <output class="control__value" id="glassHighlightValue"></output>
            </div>
          </div>

          <div class="control">
            <label class="control__label" for="glassSoftness">Glass Softness</label>
            <div class="control__row">
              <input id="glassSoftness" type="range" min="0" max="1" step="0.01" />
              <output class="control__value" id="glassSoftnessValue"></output>
            </div>
          </div>

          <div id="glassBandsControls">
          <div class="control">
            <label class="control__label" for="glassBandsCount">Bands Count</label>
            <div class="control__row">
              <input id="glassBandsCount" type="range" min="6" max="80" step="1" />
              <output class="control__value" id="glassBandsCountValue"></output>
            </div>
          </div>
          </div>

          <div id="glassOvalsControls" hidden>
          <div class="control">
            <label class="control__label" for="glassCount">Ovals Count</label>
            <div class="control__row">
              <input id="glassCount" type="range" min="0" max="10" step="1" />
              <output class="control__value" id="glassCountValue"></output>
            </div>
          </div>
          </div>

          <div id="glassCirclesControls" hidden>
          <div class="control">
            <label class="control__label" for="glassCirclesAmount">Circles Strength</label>
            <div class="control__row">
              <input id="glassCirclesAmount" type="range" min="0" max="1" step="0.01" />
              <output class="control__value" id="glassCirclesAmountValue"></output>
            </div>
          </div>

          <div class="control">
            <label class="control__label" for="glassCirclesScale">Circles Scale</label>
            <div class="control__row">
              <input id="glassCirclesScale" type="range" min="0" max="1" step="0.01" />
              <output class="control__value" id="glassCirclesScaleValue"></output>
            </div>
          </div>

          <div class="control">
            <label class="control__label" for="glassCirclesRotate">Circles Rotation</label>
            <div class="control__row">
              <input id="glassCirclesRotate" type="range" min="-180" max="180" step="1" />
              <output class="control__value" id="glassCirclesRotateValue"></output>
            </div>
          </div>

          <div class="control">
            <label class="control__label" for="glassCirclesThickness">Circles Thickness</label>
            <div class="control__row">
              <input id="glassCirclesThickness" type="range" min="0" max="1" step="0.01" />
              <output class="control__value" id="glassCirclesThicknessValue"></output>
            </div>
          </div>

          <div class="control">
            <label class="control__label" for="glassCirclesStretch">Circles Stretch</label>
            <div class="control__row">
              <input id="glassCirclesStretch" type="range" min="0" max="1" step="0.01" />
              <output class="control__value" id="glassCirclesStretchValue"></output>
            </div>
          </div>
          </div>
        </div>

        <div id="waveWarpControls" hidden>
          <div class="control">
            <label class="control__label" for="waveAmount">Wave Amount</label>
            <div class="control__row">
              <input id="waveAmount" type="range" min="0" max="1" step="0.01" />
              <output class="control__value" id="waveAmountValue"></output>
            </div>
          </div>

          <div class="control">
            <label class="control__label" for="waveScale">Wave Scale</label>
            <div class="control__row">
              <input id="waveScale" type="range" min="0" max="1" step="0.01" />
              <output class="control__value" id="waveScaleValue"></output>
            </div>
          </div>

          <div class="control">
            <label class="control__label" for="waveSpeed">Wave Speed</label>
            <div class="control__row">
              <input id="waveSpeed" type="range" min="0" max="1" step="0.01" />
              <output class="control__value" id="waveSpeedValue"></output>
            </div>
          </div>

          <div class="control">
            <label class="control__label" for="waveAngle">Wave Angle</label>
            <div class="control__row">
              <input id="waveAngle" type="range" min="-180" max="180" step="1" />
              <output class="control__value" id="waveAngleValue"></output>
            </div>
          </div>

          <div class="control">
            <label class="control__label" for="waveDetail">Wave Detail</label>
            <div class="control__row">
              <input id="waveDetail" type="range" min="0" max="1" step="0.01" />
              <output class="control__value" id="waveDetailValue"></output>
            </div>
          </div>
        </div>

        <div class="panel__divider"></div>

        <!-- Background color (same interaction pattern as blobs: color input + swatches) -->
        <div class="blob blob--bg">
          <div class="blob__head">
            <div class="blob__label">Background</div>
            <input id="bgColor" type="color" value="#0B0712" />
          </div>
          <div class="swatches" id="bgSwatches" aria-label="Background swatches"></div>
        </div>

        <div class="panel__divider"></div>

        <div class="blobControls" id="blobControls"></div>

        <div class="panel__divider"></div>

        <div class="saved" id="saved">
          <div class="saved__head">
            <div class="saved__title">Saved versions</div>
            <button class="btn" id="saveVersion" type="button">Save</button>
          </div>
          <div class="saved__list" id="savedList"></div>
        </div>
      </div>
    </aside>

    <!-- Embed panel (top-right, separate from the menu) -->
    <aside class="panel panel--right" id="embedPanel" aria-label="Embed code">
      <div class="panel__body">
        <div class="export" id="export">
          <button class="export__toggle" id="embedToggle" type="button" aria-expanded="false">
            <span>Embed code</span>
            <span class="export__chev" aria-hidden="true"></span>
          </button>
          <div class="export__body" id="exportBody" hidden>
            <div class="export__actions">
              <button class="btn btn--ghost" id="copyEmbed" type="button">Copy HTML</button>
              <button class="btn" id="copyVev" type="button">To VEV</button>
            </div>
            <textarea
              id="embedCode"
              class="export__code"
              rows="10"
              readonly
              spellcheck="false"
            ></textarea>
          </div>
        </div>
      </div>
    </aside>

    <script src="./script.js"></script>
  </body>
</html>
